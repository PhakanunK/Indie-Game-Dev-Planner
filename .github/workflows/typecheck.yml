name: TypeCheck
on:
  push:
    branches: [main, develop]

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install
        working-directory: frontend

      - run: npx tsc --noEmit
        working-directory: frontend